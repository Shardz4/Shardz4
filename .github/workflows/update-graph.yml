name: Update Animated Contribution Graph

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  update-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the workflow to commit and push changes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Animated Graph
        run: python assets/build_animated_graph.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animated-activity.svg
          if git diff --staged --quiet; then
            echo "No changes in activity graph"
          else
            git commit -m "chore: update animated contribution graph [skip ci]"
            git push
          fi
