<svg viewBox="0 0 880 24" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Horizontal ground line left and right -->
  <line x1="0" y1="12" x2="396" y2="12" stroke="#1A1A1A" stroke-width="4"/>
  <line x1="0" y1="14" x2="396" y2="14" stroke="#B85B14" stroke-width="2"/>
  
  <line x1="484" y1="12" x2="880" y2="12" stroke="#1A1A1A" stroke-width="4"/>
  <line x1="484" y1="14" x2="880" y2="14" stroke="#B85B14" stroke-width="2"/>

  <!-- Left Brick Block -->
  <g transform="translate(406, 2)">
    <rect width="20" height="20" fill="#B85B14" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="10" y1="0" x2="10" y2="20" stroke="#5C3A1E" stroke-width="2"/>
    <line x1="0" y1="10" x2="20" y2="10" stroke="#5C3A1E" stroke-width="2"/>
  </g>

  <!-- Center Question Block -->
  <g transform="translate(430, 2)">
    <rect width="20" height="20" fill="#FBD000" stroke="#1A1A1A" stroke-width="2"/>
    <text x="10" y="15" font-family="monospace" font-size="14" font-weight="bold" fill="#1A1A1A" text-anchor="middle">?</text>
  </g>

  <!-- Right Brick Block -->
  <g transform="translate(454, 2)">
    <rect width="20" height="20" fill="#B85B14" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="10" y1="0" x2="10" y2="20" stroke="#5C3A1E" stroke-width="2"/>
    <line x1="0" y1="10" x2="20" y2="10" stroke="#5C3A1E" stroke-width="2"/>
  </g>
</svg>
